<header class="header">
  <div class="container header-inner">
    <a href="{{ '/' | relative_url }}" class="logo">
      <span class="logo-icon">🧪</span>
      <span class="logo-text">SoSME's Lab</span>
    </a>
    
    <nav class="nav">
      {% for item in site.navigation %}
        <a href="{{ item.link | relative_url }}" class="nav-link{% if page.url == item.link %} active{% endif %}">
          {{ item.name }}
        </a>
      {% endfor %}
    </nav>
    
    <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
      <span class="theme-toggle-light">☀️</span>
      <span class="theme-toggle-dark">🌙</span>
    </button>
    
    <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="菜单">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

<script>
// Mobile menu toggle
document.getElementById('mobile-menu-toggle')?.addEventListener('click', function() {
  document.querySelector('.nav').classList.toggle('mobile-open');
  this.classList.toggle('active');
});
</script>
