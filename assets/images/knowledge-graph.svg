<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect width="600" height="400" fill="#f8f9fa" rx="10" ry="10"/>
  
  <text x="300" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Personal Knowledge Graph</text>
  
  <!-- Central Node: User -->
  <circle cx="300" cy="200" r="40" fill="#228be6" stroke="#1864ab" stroke-width="2"/>
  <text x="300" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">SoSME</text>
  
  <!-- Node: Project 1 -->
  <circle cx="150" cy="120" r="30" fill="#eebefa" stroke="#be4bdb" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" font-size="12" fill="#862e9c">OpenClaw</text>
  <text x="150" y="160" text-anchor="middle" font-size="10" fill="#862e9c">(Interest)</text>
  
  <!-- Node: Project 2 -->
  <circle cx="450" cy="120" r="30" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2"/>
  <text x="450" y="125" text-anchor="middle" font-size="12" fill="#2b8a3e">Metro</text>
  <text x="450" y="160" text-anchor="middle" font-size="10" fill="#2b8a3e">(Job)</text>
  
  <!-- Node: Skill -->
  <circle cx="200" cy="300" r="25" fill="#dbe4ff" stroke="#4c6ef5" stroke-width="2"/>
  <text x="200" y="305" text-anchor="middle" font-size="11" fill="#364fc7">JS / Node</text>
  
  <!-- Node: Preference -->
  <circle cx="400" cy="300" r="25" fill="#ffd8a8" stroke="#fd7e14" stroke-width="2"/>
  <text x="400" y="305" text-anchor="middle" font-size="11" fill="#d9480f">Auto</text>
  <text x="400" y="320" text-anchor="middle" font-size="10" fill="#d9480f">Scripts</text>
  
  <!-- Links -->
  <line x1="300" y1="200" x2="150" y2="120" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="300" y1="200" x2="450" y2="120" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="300" y1="200" x2="200" y2="300" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="300" y1="200" x2="400" y2="300" stroke="#adb5bd" stroke-width="1.5"/>
  
  <!-- Secondary Links -->
  <line x1="150" y1="120" x2="200" y2="300" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4"/>
  <line x1="450" y1="120" x2="400" y2="300" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4"/>
</svg>