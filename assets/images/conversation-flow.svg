<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect width="600" height="400" fill="#f8f9fa" rx="10" ry="10"/>
  
  <text x="300" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Conversation Learning Process</text>
  
  <!-- Step 1: User Message -->
  <rect x="50" y="80" width="150" height="60" rx="8" ry="8" fill="#dbe4ff" stroke="#4c6ef5" stroke-width="2"/>
  <text x="125" y="110" text-anchor="middle" font-size="14" fill="#364fc7">User Message</text>
  <text x="125" y="125" text-anchor="middle" font-size="12" fill="#5c7cfa">(Input)</text>
  
  <!-- Arrow Right -->
  <path d="M200 110 L240 110" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow-right)"/>
  
  <!-- Step 2: Semantic Analysis -->
  <rect x="250" y="80" width="150" height="60" rx="8" ry="8" fill="#eebefa" stroke="#be4bdb" stroke-width="2"/>
  <text x="325" y="110" text-anchor="middle" font-size="14" fill="#862e9c">Semantic Analysis</text>
  <text x="325" y="125" text-anchor="middle" font-size="12" fill="#ae3ec9">(LLM)</text>
  
  <!-- Arrow Down -->
  <path d="M325 140 L325 180" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow-down)"/>
  
  <!-- Step 3: Extract Insights -->
  <rect x="250" y="190" width="150" height="60" rx="8" ry="8" fill="#ffd8a8" stroke="#fd7e14" stroke-width="2"/>
  <text x="325" y="220" text-anchor="middle" font-size="14" fill="#d9480f">Extract Insights</text>
  <text x="325" y="235" text-anchor="middle" font-size="12" fill="#e8590c">(Facts, Preferences)</text>
  
  <!-- Arrow Left -->
  <path d="M250 220 L210 220" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow-left)"/>
  
  <!-- Step 4: Classification -->
  <rect x="50" y="190" width="150" height="60" rx="8" ry="8" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2"/>
  <text x="125" y="220" text-anchor="middle" font-size="14" fill="#2b8a3e">Classification</text>
  <text x="125" y="235" text-anchor="middle" font-size="12" fill="#40c057">(Type: Decision/Habit)</text>
  
  <!-- Arrow Down -->
  <path d="M125 250 L125 290" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow-down)"/>
  
  <!-- Step 5: Storage -->
  <rect x="50" y="300" width="350" height="50" rx="8" ry="8" fill="#343a40" stroke="#212529" stroke-width="2"/>
  <text x="225" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Store in Memory (JSON/Obsidian)</text>
  
  <!-- Confidence Check -->
  <circle cx="500" cy="220" r="40" fill="#fff" stroke="#fa5252" stroke-width="2" stroke-dasharray="4"/>
  <text x="500" y="215" text-anchor="middle" font-size="12" fill="#fa5252">Confidence</text>
  <text x="500" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#fa5252">> 0.8?</text>
  
  <!-- Line from Extract to Confidence -->
  <path d="M400 220 L460 220" stroke="#adb5bd" stroke-width="1.5"/>
  
  <defs>
    <marker id="arrow-right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#adb5bd" />
    </marker>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#adb5bd" transform="rotate(90 4.5 3)"/>
    </marker>
    <marker id="arrow-left" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#adb5bd" transform="rotate(180 4.5 3)"/>
    </marker>
  </defs>
</svg>