<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Continuous Learning Skill 系统架构</text>
  
  <!-- User -->
  <g transform="translate(360, 80)">
    <circle cx="40" cy="40" r="30" fill="#4dabf7"/>
    <text x="40" y="85" text-anchor="middle" font-size="14" fill="#333">用户</text>
  </g>
  
  <!-- Arrow Down -->
  <path d="M400 130 L400 170" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- OpenClaw Core -->
  <rect x="250" y="180" width="300" height="80" rx="8" ry="8" fill="#e9ecef" stroke="#ced4da" stroke-width="2"/>
  <text x="400" y="225" text-anchor="middle" font-size="18" font-weight="bold" fill="#495057">OpenClaw 核心</text>
  
  <!-- Modules Container -->
  <rect x="50" y="300" width="700" height="150" rx="10" ry="10" fill="#fff" stroke="#dee2e6" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="290" text-anchor="middle" font-size="14" fill="#868e96">学习模块 (Learning Modules)</text>
  
  <!-- Module 1: Conversation -->
  <rect x="70" y="330" width="150" height="80" rx="6" ry="6" fill="#dbe4ff" stroke="#4c6ef5" stroke-width="2"/>
  <text x="145" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#364fc7">对话学习</text>
  <text x="145" y="385" text-anchor="middle" font-size="12" fill="#364fc7">Conversation</text>
  
  <!-- Module 2: Note Analysis -->
  <rect x="240" y="330" width="150" height="80" rx="6" ry="6" fill="#eebefa" stroke="#be4bdb" stroke-width="2"/>
  <text x="315" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#862e9c">笔记分析</text>
  <text x="315" y="385" text-anchor="middle" font-size="12" fill="#862e9c">(Obsidian)</text>
  
  <!-- Module 3: Behavior -->
  <rect x="410" y="330" width="150" height="80" rx="6" ry="6" fill="#ffd8a8" stroke="#fd7e14" stroke-width="2"/>
  <text x="485" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#d9480f">行为观察</text>
  <text x="485" y="385" text-anchor="middle" font-size="12" fill="#d9480f">Behavior</text>
  
  <!-- Module 4: Web -->
  <rect x="580" y="330" width="150" height="80" rx="6" ry="6" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2"/>
  <text x="655" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b8a3e">网络聚合</text>
  <text x="655" y="385" text-anchor="middle" font-size="12" fill="#2b8a3e">Web</text>
  
  <!-- Connecting Arrows -->
  <path d="M400 260 L400 300" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 260 L145 330" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4"/>
  <path d="M400 260 L315 330" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4"/>
  <path d="M400 260 L485 330" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4"/>
  <path d="M400 260 L655 330" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Storage Layer -->
  <rect x="150" y="500" width="500" height="60" rx="8" ry="8" fill="#343a40" stroke="#212529" stroke-width="2"/>
  <text x="400" y="535" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">长期记忆 / 知识图谱</text>
  
  <!-- Arrows to Storage -->
  <path d="M145 410 L145 480 L200 500" stroke="#adb5bd" stroke-width="2" fill="none"/>
  <path d="M315 410 L315 480 L350 500" stroke="#adb5bd" stroke-width="2" fill="none"/>
  <path d="M485 410 L485 480 L450 500" stroke="#adb5bd" stroke-width="2" fill="none"/>
  <path d="M655 410 L655 480 L600 500" stroke="#adb5bd" stroke-width="2" fill="none"/>
  
  <!-- Definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#adb5bd" />
    </marker>
  </defs>
</svg>